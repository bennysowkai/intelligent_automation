version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: automation-hub-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=http://localhost:8080
      - GRAPH_TENANT_ID=mock-tenant-id-12345
      - GRAPH_CLIENT_ID=mock-client-id-67890
      - GRAPH_BASE_URL=https://graph.microsoft.com/v1.0
    networks:
      - automation-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (serves frontend and proxies API)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: automation-hub-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - automation-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  automation-network:
    driver: bridge
